<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="app-title">Guía de Profesiones y Economía WoW</title>
    
    <!-- Script de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6055882420759450"
         crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(15, 23, 42, 0.95);
            --bg-input: rgba(30, 41, 59, 0.85);
            --border-color: rgba(51, 65, 85, 0.8);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body.theme-alliance { --accent-gold: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.25); }
        body.theme-horde { --accent-gold: #dc2626; --accent-glow: rgba(220, 38, 38, 0.25); }
        body.theme-fel { --accent-gold: #10b981; --accent-glow: rgba(16, 185, 129, 0.25); }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 10%, var(--accent-glow) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(6, 9, 19, 0.92), rgba(6, 9, 19, 0.98));
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            box-sizing: border-box;
            width: 100%;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 14px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.35rem;
            color: var(--accent-gold);
            font-weight: 800;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .donate-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ad-banner {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed var(--border-color);
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        select, input {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: var(--accent-glow);
            border: 1px solid var(--accent-gold);
        }

        .realm-config-grid, .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .control-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .professions-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .prof-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .prof-btn.active {
            background: var(--accent-gold);
            color: #060913;
            border-color: var(--accent-gold);
            font-weight: 800;
        }

        .main-action-btn {
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            color: #060913;
            border: none;
            padding: 12px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .recipe-card {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-gold);
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 320px;
            box-sizing: border-box;
        }

        th {
            background: rgba(30, 41, 59, 0.95);
            color: var(--text-muted);
            text-align: left;
            padding: 8px 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-word;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(6, 9, 19, 0.9);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-top: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        .summary-box {
            background: rgba(30, 41, 59, 0.4);
            padding: 8px 4px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .summary-box span {
            font-size: 0.62rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .summary-box strong {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .badge-thermometer {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-top: 6px;
        }

        .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .action-row-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .secondary-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .input-owned {
            width: 45px;
            padding: 6px 2px;
            text-align: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-weight: 700;
        }

        .input-price {
            width: 90px;
            padding: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 800;
            border-radius: 6px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }
        .fav-btn.active { color: var(--accent-gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media (min-width: 768px) {
            body { padding: 30px; }
            .container { padding: 30px; border-radius: 18px; }
            h1 { font-size: 1.8rem; }
            .realm-config-grid { grid-template-columns: 1fr 2fr; }
            .controls-grid { grid-template-columns: 2fr 1fr 1fr; }
            .summary-grid { grid-template-columns: repeat(4, 1fr); padding: 15px; }
            .summary-box { padding: 10px; }
            .summary-box span { font-size: 0.7rem; }
            .summary-box strong { font-size: 1.2rem; }
            .action-row-buttons { flex-direction: row; }
            table { font-size: 0.9rem; }
            th { font-size: 0.75rem; padding: 12px 8px; }
            td { padding: 12px 8px; }
            .recipe-card { padding: 25px; }
        }
    </style>
</head>
<body class="theme-goblin">
    
    <div class="container">
        <header>
            <h1 id="app-title">Guía de Profesiones y Economía WoW</h1>
            <div class="header-controls">
                <a href="https://ko-fi.com/vallejosemmiiii" target="_blank" class="donate-btn" id="btn-donate">☕ Donar</a>
                <select id="theme-selector" style="width: auto;" title="Tema Visual">
                    <option value="goblin">🟡 Goblin</option>
                    <option value="alliance">🔵 Alliance</option>
                    <option value="horde">🔴 Horde</option>
                    <option value="fel">🟢 Fel</option>
                </select>
                <!-- SELECTOR DE IDIOMAS -->
                <select id="lang-selector" style="width: auto;" title="Idioma / Language">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </header>

        <div class="ad-banner">
            <span id="ad-text">[Espacio Publicitario / Google AdSense]</span>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="tab-calculator" id="nav-calc">🧮 Calculadora</button>
            <button class="tab-btn" data-tab="tab-budget" id="nav-budget">💰 Presupuesto</button>
            <button class="tab-btn" data-tab="tab-flips" id="nav-flips">📈 Flips</button>
            <button class="tab-btn" data-tab="tab-session" id="nav-session">📊 Sesión</button>
        </div>

        <div class="realm-config-grid">
            <div class="control-group">
                <label id="lbl-region">Región:</label>
                <select id="region-selector">
                    <option value="us">US (América)</option>
                    <option value="eu">EU (Europa)</option>
                    <option value="kr">KR (Corea)</option>
                    <option value="tw">TW (Taiwán)</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-realm">Servidor de Juego:</label>
                <select id="realm-selector">
                    <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                    <option value="quelthalas">Quel'Thalas (US)</option>
                    <option value="ragnaros">Ragnaros (US)</option>
                    <option value="sanguino">Sanguino (EU - ES)</option>
                    <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                    <option value="blackhand">Blackhand (EU - DE)</option>
                </select>
            </div>
        </div>

        <!-- PESTAÑA 1: CALCULADORA -->
        <div id="tab-calculator" class="tab-content active">
            <div class="controls-grid">
                <div class="control-group">
                    <label id="lbl-craft-qty">Cantidad:</label>
                    <select id="craft-qty-multiplier">
                        <option value="1">x1 Lote</option>
                        <option value="5">x5 Lotes</option>
                        <option value="10">x10 Lotes</option>
                        <option value="20">x20 Lotes</option>
                        <option value="50">x50 Lotes</option>
                    </select>
                </div>
                <div class="control-group">
                    <label id="lbl-search">Buscar Receta:</label>
                    <input type="text" id="recipe-search" placeholder="Ej. Frasco, Gema...">
                </div>
            </div>

            <div class="professions-nav" id="professions-nav">
                <button class="prof-btn active" data-prof="all" id="prof-all">Todas</button>
                <button class="prof-btn" data-prof="favorites" id="prof-fav">⭐ Favoritas</button>
                <button class="prof-btn" data-prof="alchemy" id="prof-alc">Alquimia</button>
                <button class="prof-btn" data-prof="jewelcrafting" id="prof-jew">Joyería</button>
                <button class="prof-btn" data-prof="blacksmithing" id="prof-bs">Herrería</button>
                <button class="prof-btn" data-prof="enchanting" id="prof-enc">Encantamiento</button>
                <button class="prof-btn" data-prof="leatherworking" id="prof-lw">Peletería</button>
                <button class="prof-btn" data-prof="tailoring" id="prof-tail">Sastrería</button>
                <button class="prof-btn" data-prof="engineering" id="prof-eng">Ingeniería</button>
            </div>

            <div class="control-group" style="margin-bottom: 15px;">
                <label id="lbl-recipe-select">Receta Específica:</label>
                <select id="recipe-selector">
                    <option value="" id="opt-default-recipe">Selecciona una receta...</option>
                </select>
            </div>

            <button id="calculate-btn" class="main-action-btn">Calcular Ganancias</button>
            <div id="results-container">
                <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 30px; font-size: 0.85rem;">Selecciona un servidor y una receta...</p>
            </div>
        </div>

        <!-- PESTAÑA 2: PRESUPUESTO -->
        <div id="tab-budget" class="tab-content">
            <div class="control-group" style="margin-bottom: 15px;">
                <label id="lbl-budget-gold">Oro Disponible:</label>
                <input type="number" id="budget-input" placeholder="Ej. 10000" value="10000">
            </div>
            <button id="btn-run-budget" class="main-action-btn">Buscar Rentables</button>
            <div id="budget-results" style="margin-top: 15px; overflow-x: auto;"></div>
        </div>

        <!-- PESTAÑA 3: FLIPS -->
        <div id="tab-flips" class="tab-content">
            <button id="btn-run-flips" class="main-action-btn">Escanear Flips</button>
            <div id="flips-results" style="margin-top: 15px; overflow-x: auto;"></div>
        </div>

        <!-- PESTAÑA 4: SESIÓN -->
        <div id="tab-session" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; color: var(--accent-gold); font-size: 1rem;" id="session-title">Resumen de Crafteos</h3>
                <button id="btn-clear-session" class="secondary-btn" style="width: auto; padding: 6px 10px; font-size: 0.75rem;">Vaciar</button>
            </div>
            <div id="session-summary-box" class="summary-grid" style="margin-bottom: 15px; grid-template-columns: repeat(2, 1fr);">
                <div class="summary-box"><span id="session-lbl-reg">Registrados</span><strong id="session-count">0</strong></div>
                <div class="summary-box"><span id="session-lbl-cost">Inversión</span><strong style="color: var(--red);" id="session-cost">0.00g</strong></div>
            </div>
            <div id="session-list" style="overflow-x: auto;"></div>
        </div>
    </div>

    <script>
        // Sistema de Traducción Idiomas (ES / EN)
        const translations = {
            es: {
                title: "Guía de Profesiones y Economía WoW",
                donate: "☕ Donar",
                adText: "[Espacio Publicitario / Google AdSense]",
                navCalc: "🧮 Calculadora",
                navBudget: "💰 Presupuesto",
                navFlips: "📈 Flips",
                navSession: "📊 Sesión",
                lblRegion: "Región:",
                lblRealm: "Servidor de Juego:",
                optDefaultRealm: "Selecciona tu servidor...",
                lblCraftQty: "Cantidad:",
                lblSearch: "Buscar Receta:",
                searchPlaceholder: "Ej. Frasco, Gema...",
                profAll: "Todas",
                profFav: "⭐ Favoritas",
                profAlc: "Alquimia",
                profJew: "Joyería",
                profBs: "Herrería",
                profEnc: "Encantamiento",
                profLw: "Peletería",
                profTail: "Sastrería",
                profEng: "Ingeniería",
                lblRecipeSelect: "Receta Específica:",
                optDefaultRecipe: "Selecciona una receta...",
                calcBtn: "Calcular Ganancias",
                defaultText: "Selecciona un servidor y una receta...",
                lblBudgetGold: "Oro Disponible:",
                btnRunBudget: "Buscar Rentables",
                btnRunFlips: "Escanear Flips",
                sessionTitle: "Resumen de Crafteos",
                sessionClear: "Vaciar",
                sessionReg: "Registrados",
                sessionCost: "Inversión"
            },
            en: {
                title: "WoW Professions & Economy Guide",
                donate: "☕ Donate",
                adText: "[Ad Space / Google AdSense]",
                navCalc: "🧮 Calculator",
                navBudget: "💰 Budget",
                navFlips: "📈 Flips",
                navSession: "📊 Session",
                lblRegion: "Region:",
                lblRealm: "Game Realm:",
                optDefaultRealm: "Select your realm...",
                lblCraftQty: "Quantity:",
                lblSearch: "Search Recipe:",
                searchPlaceholder: "Ex. Flask, Gem...",
                profAll: "All",
                profFav: "⭐ Favorites",
                profAlc: "Alchemy",
                profJew: "Jewelcrafting",
                profBs: "Blacksmithing",
                profEnc: "Enchanting",
                profLw: "Leatherworking",
                profTail: "Tailoring",
                profEng: "Engineering",
                lblRecipeSelect: "Specific Recipe:",
                optDefaultRecipe: "Select a recipe...",
                calcBtn: "Calculate Profits",
                defaultText: "Select a realm and recipe...",
                lblBudgetGold: "Available Gold:",
                btnRunBudget: "Find Profitable",
                btnRunFlips: "Scan Flips",
                sessionTitle: "Crafting Summary",
                sessionClear: "Clear",
                sessionReg: "Registered",
                sessionCost: "Investment"
            }
        };

        const langSelector = document.getElementById('lang-selector');
        langSelector.addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        function setLanguage(lang) {
            const t = translations[lang] || translations.es;
            document.getElementById('app-title').innerText = t.title;
            document.title = t.title;
            document.getElementById('btn-donate').innerHTML = t.donate;
            document.getElementById('ad-text').innerText = t.adText;
            document.getElementById('nav-calc').innerText = t.navCalc;
            document.getElementById('nav-budget').innerText = t.navBudget;
            document.getElementById('nav-flips').innerText = t.navFlips;
            document.getElementById('nav-session').innerText = t.navSession;
            document.getElementById('lbl-region').innerText = t.lblRegion;
            document.getElementById('lbl-realm').innerText = t.lblRealm;
            document.getElementById('opt-default-realm').innerText = t.optDefaultRealm;
            document.getElementById('lbl-craft-qty').innerText = t.lblCraftQty;
            document.getElementById('lbl-search').innerText = t.lblSearch;
            document.getElementById('recipe-search').placeholder = t.searchPlaceholder;
            document.getElementById('prof-all').innerText = t.profAll;
            document.getElementById('prof-fav').innerText = t.profFav;
            document.getElementById('prof-alc').innerText = t.profAlc;
            document.getElementById('prof-jew').innerText = t.profJew;
            document.getElementById('prof-bs').innerText = t.profBs;
            document.getElementById('prof-enc').innerText = t.profEnc;
            document.getElementById('prof-lw').innerText = t.profLw;
            document.getElementById('prof-tail').innerText = t.profTail;
            document.getElementById('prof-eng').innerText = t.profEng;
            document.getElementById('lbl-recipe-select').innerText = t.lblRecipeSelect;
            document.getElementById('opt-default-recipe').innerText = t.optDefaultRecipe;
            document.getElementById('calculate-btn').innerText = t.calcBtn;
            const defText = document.getElementById('default-text');
            if(defText) defText.innerText = t.defaultText;
            document.getElementById('lbl-budget-gold').innerText = t.lblBudgetGold;
            document.getElementById('btn-run-budget').innerText = t.btnRunBudget;
            document.getElementById('btn-run-flips').innerText = t.btnRunFlips;
            document.getElementById('session-title').innerText = t.sessionTitle;
            document.getElementById('btn-clear-session').innerText = t.sessionClear;
            document.getElementById('session-lbl-reg').innerText = t.sessionReg;
            document.getElementById('session-lbl-cost').innerText = t.sessionCost;
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
